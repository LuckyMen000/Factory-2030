name: factoryops

# Pulls images built by .github/workflows/docker.yml.
# For this unauthenticated demo, expose only on loopback by default.
services:
  backend:
    image: ${IMAGE_BASE:?Set IMAGE_BASE in .env to ghcr.io/owner/repository}-backend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - factoryops-db:/app/data
      - factoryops-uploads:/app/uploads
    environment:
      DATABASE_URL: sqlite:////app/data/factoryops.db
      UPLOAD_DIR: /app/uploads
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${IMAGE_BASE:?Set IMAGE_BASE in .env to ghcr.io/owner/repository}-frontend:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  factoryops-db:
  factoryops-uploads:
