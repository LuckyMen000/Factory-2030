name: factory2030
services:
  backend:
    build: ./backend
    image: factory2030-backend:local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - maintenance-db:/app/data
    environment:
      DB_PATH: /app/data/maintenance.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: factory2030-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
volumes:
  maintenance-db:
